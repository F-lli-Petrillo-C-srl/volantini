  .logo{display:block;width:100%;aspect-ratio:943/96;background:var(--logo) left center/contain no-repeat;animation:rivela .45s cubic-bezier(.3,.7,.2,1) both}
  @keyframes rivela{from{clip-path:inset(0 100% 0 0);opacity:.3;translate:-6px 0}to{clip-path:inset(0 0 0 0);opacity:1;translate:0 0}}
  .luccichio{position:absolute;left:0;right:0;top:0;aspect-ratio:943/96;pointer-events:none;
    -webkit-mask:var(--logo) left center/contain no-repeat;mask:var(--logo) left center/contain no-repeat;
    background:linear-gradient(105deg,transparent 30%,#14C850 40%,#fff 50%,#FF4048 60%,transparent 70%) no-repeat;background-size:300% 100%;
    animation:brilla .9s .3s ease-in-out both,brillaPiano 9s 3s ease-in-out infinite}
  @keyframes brilla{from{background-position:120% 0}to{background-position:-20% 0}}
  @keyframes brillaPiano{0%,82%{background-position:120% 0;opacity:0}83%{opacity:.75}100%{background-position:-20% 0;opacity:.75}}
  .tricolore{display:block;height:3px;width:0;margin-top:5px;border-radius:2px;background:linear-gradient(90deg,#14C850 0 33.3%,#fff 33.3% 66.6%,#FF4048 66.6%);animation:cresci .5s .45s cubic-bezier(.3,.7,.2,1) forwards}
  @keyframes cresci{to{width:54px}}
  h1{font-size:22px;font-weight:700;line-height:1.15;animation:entra .5s .08s cubic-bezier(.2,.7,.2,1) both}
  .prova{display:inline-block;margin-left:8px;vertical-align:middle;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.22);padding:3px 8px;border-radius:999px}
  main{max-width:1100px;margin:0 auto;padding:18px 16px calc(40px + env(safe-area-inset-bottom))}
  .nota{font-size:13px;color:var(--testo-soft);margin:0 2px 16px;line-height:1.45}
  .nota b{color:var(--testo)}
  @keyframes entra{from{opacity:0;translate:0 18px}to{opacity:1;translate:0 0}}
  .anima{animation:entra .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 70ms)}

  /* Elenco artwork */
  .elenco{display:grid;grid-template-columns:1fr;gap:16px}
  @media (min-width:760px){.elenco{grid-template-columns:1fr 1fr}}
  .aw{background:var(--card);border-radius:16px;overflow:hidden;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08),0 8px 22px rgba(0,40,90,.08);transition:transform .15s,box-shadow .2s;border:0;text-align:left;font:inherit;color:inherit;display:block;width:100%}
  .aw:active{transform:scale(.985)}
  @media (hover:hover){.aw:hover{box-shadow:0 2px 6px rgba(0,0,0,.1),0 14px 32px rgba(0,98,189,.16)}}
  .aw-img{display:block;width:100%;height:auto;background:#e4ebf3}
  .aw-info{padding:12px 14px 14px;display:flex;align-items:center;gap:12px}
  .aw-tit{font-weight:750;font-size:16px;line-height:1.2}
  .aw-sub{font-size:12.5px;color:var(--testo-soft);margin-top:3px}
  .aw-n{margin-left:auto;flex-shrink:0;background:var(--c,var(--brand));color:#fff;font-weight:700;font-size:13px;padding:7px 12px;border-radius:999px;white-space:nowrap}

  /* Scheda artwork a schermo intero */
  .pan{position:fixed;inset:0;z-index:20;background:var(--sfondo);display:none;flex-direction:column}
  .pan.aperto{display:flex;animation:sale .3s cubic-bezier(.2,.7,.2,1) both}
  @keyframes sale{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  .pan-top{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:var(--c,var(--brand));color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15)}
  .pan-tit{font-weight:700;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .btn{background:rgba(255,255,255,.2);color:inherit;border:0;border-radius:999px;height:40px;min-width:40px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font:inherit;font-weight:600}
  .btn svg{width:20px;height:20px}
  .pan-corpo{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .pan-in{max-width:1100px;margin:0 auto;padding:14px 14px calc(40px + env(safe-area-inset-bottom))}
  .pan-img{display:block;width:100%;height:auto;border-radius:14px;box-shadow:0 6px 20px rgba(0,40,90,.14);background:#e4ebf3;cursor:zoom-in}
  .mecc{margin-top:14px;background:var(--card);border-radius:14px;padding:14px 16px;border-left:5px solid var(--c,var(--brand));box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .mecc .val{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--c,var(--brand))}
  .mecc p{font-size:14.5px;line-height:1.45;margin-top:6px}
  .sez{display:flex;align-items:baseline;gap:8px;font-size:13px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;color:var(--brand-scuro);margin:24px 2px 10px}
  .sez span{font-weight:600;color:var(--testo-soft);letter-spacing:0;text-transform:none}
  .cerca{display:flex;gap:8px;margin:0 0 10px}
  .cerca input{flex:1;min-width:0;height:42px;border-radius:12px;border:1.5px solid #d6e0ec;padding:0 14px;font:inherit;font-size:15px;background:#fff;color:var(--testo)}
  .cerca input:focus{outline:none;border-color:var(--brand)}
  .filtri{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
  .filtri::-webkit-scrollbar{display:none}
  .filtri button{flex:0 0 auto;border:1.5px solid #d6e0ec;background:#fff;color:var(--testo);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  .filtri button.si{background:var(--c,var(--brand));border-color:transparent;color:#fff}
  .prodotti{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  @media (max-width:520px){.prodotti{grid-template-columns:1fr 1fr}}
  .pr{background:var(--card);border:0;border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;font:inherit;color:inherit;display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(0,0,0,.07);transition:transform .15s}
  .pr:active{transform:scale(.97)}
  .pr-foto{aspect-ratio:1;background:#fff;display:flex;align-items:center;justify-content:center;padding:10px;border-bottom:1px solid #eef2f7}
  .pr-foto img{max-width:100%;max-height:100%;object-fit:contain;display:block}
  .pr-info{padding:9px 10px 11px;display:flex;flex-direction:column;gap:6px;flex:1}
  .pr-des{font-size:12.5px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .prezzo{margin-top:auto;display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
  .prezzo b{font-size:18px;font-weight:800;color:var(--brand-scuro)}
  .prezzo small{font-size:11px;color:var(--testo-soft);font-weight:600}
  .vuoto{color:var(--testo-soft);font-size:14px;padding:20px 4px}
  .altri-piu{display:block;margin:14px auto 0;background:#fff;border:1.5px solid #d6e0ec;border-radius:999px;padding:10px 18px;font:inherit;font-weight:700;color:var(--brand-scuro);cursor:pointer}

  /* Dettaglio prodotto */
  .velo{position:fixed;inset:0;z-index:30;background:rgba(10,30,60,.45);display:none;align-items:flex-end;justify-content:center}
  .velo.aperto{display:flex;animation:appare .2s ease both}
  @keyframes appare{from{opacity:0}to{opacity:1}}
  .det{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));animation:dalBasso .3s cubic-bezier(.2,.7,.2,1) both;position:relative}
  @media (min-width:600px){.velo{align-items:center}.det{border-radius:22px}}
  @keyframes dalBasso{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
  .maniglia{width:42px;height:5px;border-radius:3px;background:#d6e0ec;margin:0 auto 8px}
  .det .chiudi{position:absolute;top:10px;right:10px;background:#eef3f9;color:var(--testo)}
  .det-foto{display:flex;justify-content:center;padding:6px 0 10px}
  .det-foto img{max-width:100%;max-height:38vh;object-fit:contain}
  .det-marca{font-size:12px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;color:var(--c,var(--brand))}
  .det h2{font-size:18px;line-height:1.25;margin-top:3px}
  .det-prezzo{display:flex;gap:10px;margin-top:12px}
  .det-prezzo div{flex:1;background:#f2f6fb;border-radius:12px;padding:10px 12px}
  .det-prezzo div:first-child{background:var(--brand);color:#fff}
  .det-prezzo b{display:block;font-size:22px;font-weight:800}
  .det-prezzo span{font-size:12px;opacity:.85;font-weight:600}
  .det table{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px}
  .det td{padding:9px 2px;border-bottom:1px solid #eef2f7}
  .det td:first-child{color:var(--testo-soft)}
  .det td:last-child{text-align:right;font-weight:650;font-variant-numeric:tabular-nums}
  .det-nota{font-size:12px;color:var(--testo-soft);margin-top:12px;line-height:1.4}

  /* Lente sull'artwork */
  .zoom{position:fixed;inset:0;z-index:40;background:#0d1b2e;display:none;overflow:auto;touch-action:pan-x pan-y pinch-zoom}
  .zoom.aperto{display:block}
  .zoom img{display:block;height:100vh;height:100dvh;width:auto;max-width:none}
  @media (orientation:landscape){.zoom img{height:auto;width:100vw}}
  .zoom .btn{position:fixed;top:calc(10px + env(safe-area-inset-top));right:10px;background:#fff;color:var(--testo)}
  .errore{text-align:center;color:var(--testo-soft);padding:60px 20px}
  @media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="head-in">
    <div class="logo-box"><div class="logo" role="img" aria-label="F.lli Petrillo &amp; C. srl"></div><span class="luccichio" aria-hidden="true"></span><span class="tricolore" aria-hidden="true"></span></div>
    <h1>Artwork di Novembre <span class="prova">Prova</span></h1>
  </div>
</header>

<main>
  <p class="nota" id="nota">Caricamento…</p>
  <div class="elenco" id="elenco"></div>
</main>

<div class="pan" id="pan" role="dialog" aria-modal="true">
  <div class="pan-top">
    <div class="pan-tit" id="panTit"></div>
    <button class="btn" id="panChiudi" aria-label="Chiudi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="pan-corpo" id="panCorpo"><div class="pan-in" id="panIn"></div></div>
</div>

<div class="velo" id="velo"><div class="det" id="det" role="dialog" aria-modal="true"></div></div>
<div class="zoom" id="zoom"><img alt=""><button class="btn" aria-label="Chiudi ingrandimento"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  // prezzi come nel listino: fino a 3 decimali, almeno 2
  const euro = n => '€ ' + n.toLocaleString('it-IT', {minimumFractionDigits:2, maximumFractionDigits:3});
  const MARCHE = /^(PALETTE SYOSS|BIO PRESTO|[A-Z0-9']+)/;
  const marca = d => { const m = d.match(MARCHE); return m ? m[1].replace('PALETTE SYOSS','SYOSS') : ''; };
  let dati = null, aperta = null;

  window.datiArtwork.then(d => {
    dati = d;
    const al = (d.listino || '').replace('Listino Ufficiale ', '');
    $('nota').innerHTML = 'Tocca un\'artwork per vedere tutti gli articoli che trattiamo. Prezzi di <b>listino base, senza sconti</b> · listino ufficiale ' + esc(al) + '.';
    $('elenco').innerHTML = d.artwork.map((a, i) =>
      '<button class="aw anima" style="--i:'+i+';--c:'+a.colore+'" data-i="'+i+'">'+
        '<img class="aw-img" src="'+a.immagine+'" width="'+a.misure[0]+'" height="'+a.misure[1]+'" alt="'+esc(a.titolo)+'" '+(i<2?'fetchpriority="high"':'loading="lazy"')+' decoding="async">'+
        '<div class="aw-info"><div><div class="aw-tit">'+esc(a.titolo)+'</div><div class="aw-sub">'+esc(a.validita)+'</div></div>'+
        '<span class="aw-n">'+(a.in_artwork.length + a.partecipano.length)+' articoli</span></div></button>').join('');
    $('elenco').querySelectorAll('.aw').forEach(b => b.onclick = () => apri(+b.dataset.i));
    if(location.hash){ const i = d.artwork.findIndex(a => '#'+a.id === location.hash); if(i >= 0) apri(i, true); }
  }).catch(() => { $('elenco').innerHTML = '<div class="errore">Impossibile caricare le artwork. Controlla la connessione e riprova.</div>'; $('nota').textContent=''; });

  function card(p, k){
    return '<button class="pr" data-k="'+k+'">'+
      '<div class="pr-foto">'+(p.foto ? '<img src="'+p.foto+'" alt="" loading="lazy" decoding="async">' : '')+'</div>'+
      '<div class="pr-info"><div class="pr-des">'+esc(p.descrizione)+'</div>'+
      '<div class="prezzo"><b>'+euro(p.imponibile)+'</b><small>+ IVA</small></div></div></button>';
  }

  // ----- scheda di un'artwork
  let altri = [], filtroMarca = '', testo = '', mostrati = 0;
  const PASSO = 40;
  function apri(i, daLink){
    const a = dati.artwork[i]; aperta = a;
    const pan = $('pan');
    pan.style.setProperty('--c', a.colore); $('velo').style.setProperty('--c', a.colore);
    $('panTit').textContent = a.titolo;
    const marche = [...new Set(a.partecipano.map(p => marca(p.descrizione)))].filter(Boolean);
    $('panIn').innerHTML =
      '<img class="pan-img" id="panImg" src="'+a.immagine+'" width="'+a.misure[0]+'" height="'+a.misure[1]+'" alt="'+esc(a.titolo)+'">'+
      '<div class="mecc"><div class="val">'+esc(a.validita)+'</div>'+a.meccanica.map(m => '<p>'+esc(m)+'</p>').join('')+'</div>'+
      '<div class="sez">Gli articoli dell\'artwork <span>'+a.in_artwork.length+'</span></div>'+
      '<div class="prodotti" id="vetrina">'+a.in_artwork.map((p, k) => card(p, 'v'+k)).join('')+'</div>'+
      (a.partecipano.length ?
        '<div class="sez">Partecipano anche <span>'+a.partecipano.length+'</span></div>'+
        '<div class="cerca"><input id="cerca" type="search" placeholder="Cerca un articolo…" autocomplete="off"></div>'+
        (marche.length > 1 ? '<div class="filtri" id="filtri"><button class="si" data-m="">Tutti</button>'+marche.map(m => '<button data-m="'+esc(m)+'">'+esc(m.charAt(0)+m.slice(1).toLowerCase())+'</button>').join('')+'</div>' : '')+
        '<div class="prodotti" id="altri"></div><button class="altri-piu" id="altriPiu" hidden>Mostra altri</button>' : '');
    filtroMarca = ''; testo = '';
    disegnaAltri();
    $('panImg').onclick = () => ingrandisci(a);
    $('vetrina').onclick = e => { const b = e.target.closest('.pr'); if(b) dettaglio(a.in_artwork[+b.dataset.k.slice(1)]); };
    if($('altri')) $('altri').onclick = e => { const b = e.target.closest('.pr'); if(b) dettaglio(altri[+b.dataset.k.slice(1)]); };
    if($('cerca')) $('cerca').oninput = e => { testo = e.target.value.trim().toUpperCase(); disegnaAltri(); };
    if($('filtri')) $('filtri').onclick = e => {
      const b = e.target.closest('button'); if(!b) return;
      filtroMarca = b.dataset.m; $('filtri').querySelectorAll('button').forEach(x => x.classList.toggle('si', x === b)); disegnaAltri();
    };
    if($('altriPiu')) $('altriPiu').onclick = () => disegnaAltri(true);
    $('panCorpo').scrollTop = 0;
    pan.classList.add('aperto'); document.body.style.overflow = 'hidden';
    if(!daLink) history.pushState({p:1}, '', '#'+a.id); else history.replaceState({p:1}, '', '#'+a.id);
  }
  function disegnaAltri(ancora){
    const box = $('altri'); if(!box) return;
    const parole = testo.split(/\s+/).filter(Boolean);
    altri = aperta.partecipano.filter(p => (!filtroMarca || marca(p.descrizione) === filtroMarca) &&
      parole.every(w => p.descrizione.includes(w) || p.ean.includes(w) || p.codice.includes(w)));
    mostrati = ancora ? mostrati + PASSO : PASSO;
    box.innerHTML = altri.length ? altri.slice(0, mostrati).map((p, k) => card(p, 'a'+k)).join('') : '<div class="vuoto">Nessun articolo trovato.</div>';
    $('altriPiu').hidden = altri.length <= mostrati;
    if(!ancora) $('altriPiu').textContent = 'Mostra altri';
  }
  function chiudiPan(){ $('pan').classList.remove('aperto'); document.body.style.overflow = ''; aperta = null; }

  // ----- dettaglio di un articolo
  function dettaglio(p){
    const n = v => v ? String(v) : '–';
    const cartone = p.pz_cartone ? p.pz_cartone * p.imponibile : null;
    $('det').innerHTML =
      '<div class="maniglia"></div><button class="btn chiudi" aria-label="Chiudi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>'+
      (p.foto ? '<div class="det-foto"><img src="'+p.foto+'" alt=""></div>' : '')+
      '<div class="det-marca">'+esc(marca(p.descrizione))+'</div><h2>'+esc(p.descrizione)+'</h2>'+
      '<div class="det-prezzo"><div><span>Prezzo base</span><b>'+euro(p.imponibile)+'</b><span>+ IVA, al pezzo</span></div>'+
      '<div><span>IVA inclusa</span><b>'+euro(p.ivato)+'</b><span>IVA '+p.iva+'%</span></div></div>'+
      '<table>'+
        '<tr><td>Codice articolo</td><td>'+esc(p.codice)+'</td></tr>'+
        '<tr><td>Codice EAN</td><td>'+esc(p.ean || '–')+'</td></tr>'+
        '<tr><td>Pezzi per cartone</td><td>'+n(p.pz_cartone)+'</td></tr>'+
        (cartone ? '<tr><td>Prezzo del cartone</td><td>'+euro(Math.round(cartone*100)/100)+' + IVA</td></tr>' : '')+
        '<tr><td>Cartoni per strato</td><td>'+n(p.cartoni_strato)+'</td></tr>'+
        '<tr><td>Cartoni per pedana</td><td>'+n(p.cartoni_pedana)+'</td></tr>'+
      '</table>'+
      '<p class="det-nota">Prezzo di listino base, senza sconti né promozioni. Le condizioni dell\'artwork si applicano a parte.</p>';
    $('det').querySelector('.chiudi').onclick = () => history.back();
    $('det').scrollTop = 0;
    $('velo').classList.add('aperto');
    history.pushState({d:1}, '');
  }
  function chiudiDet(){ $('velo').classList.remove('aperto'); }
  $('velo').onclick = e => { if(e.target === $('velo')) history.back(); };

  // ----- artwork ingrandita
  function ingrandisci(a){
    const z = $('zoom'); z.querySelector('img').src = a.immagine; z.classList.add('aperto');
    z.scrollLeft = 0; history.pushState({z:1}, '');
  }
  $('zoom').querySelector('.btn').onclick = () => history.back();

  $('panChiudi').onclick = () => history.back();
  // il tasto "indietro" chiude prima la lente, poi il dettaglio, poi la scheda
  window.addEventListener('popstate', () => {
    if($('zoom').classList.contains('aperto')) return $('zoom').classList.remove('aperto');
    if($('velo').classList.contains('aperto')) return chiudiDet();
    if($('pan').classList.contains('aperto')) chiudiPan();
  });
  document.addEventListener('keydown', e => { if(e.key === 'Escape' && (aperta || $('velo').classList.contains('aperto'))) history.back(); });
})();
</script>
</body>
</html>
