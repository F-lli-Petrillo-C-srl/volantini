  .logo{display:block;width:100%;aspect-ratio:943/96;background:var(--logo) left center/contain no-repeat;animation:rivela .45s var(--molla) both}
  @keyframes rivela{from{clip-path:inset(0 100% 0 0);opacity:.3;transform:translateX(-6px)}to{clip-path:inset(0 0 0 0);opacity:1;transform:none}}
  .luccichio{position:absolute;left:0;right:0;top:0;aspect-ratio:943/96;pointer-events:none;
    -webkit-mask:var(--logo) left center/contain no-repeat;mask:var(--logo) left center/contain no-repeat;
    background:linear-gradient(105deg,transparent 30%,#14C850 40%,#fff 50%,#FF4048 60%,transparent 70%) no-repeat;background-size:300% 100%;
    animation:brilla .9s .3s ease-in-out both}
  @keyframes brilla{from{background-position:120% 0}to{background-position:-20% 0}}
  .tricolore{display:block;height:3px;width:54px;margin-top:5px;border-radius:2px;background:linear-gradient(90deg,#14C850 0 33.3%,#fff 33.3% 66.6%,#FF4048 66.6%);transform-origin:left;animation:cresci .5s .45s var(--molla) both}
  @keyframes cresci{from{transform:scaleX(0)}to{transform:none}}
  h1{font-size:22px;font-weight:750;line-height:1.15;letter-spacing:-.01em;animation:entra .5s .08s var(--molla) both}
  .prova{display:inline-block;margin-left:8px;vertical-align:middle;font-size:10.5px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.22);padding:3px 8px;border-radius:999px}

  main{max-width:1100px;margin:0 auto;padding:18px 16px calc(40px + env(safe-area-inset-bottom))}
  .nota{font-size:13.5px;color:var(--testo-soft);margin:0 2px 16px;line-height:1.5;animation:entra .5s .15s var(--molla) both}
  .nota b{color:var(--testo);font-weight:650}
  @keyframes entra{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

  /* Elenco delle artwork */
  .elenco{display:grid;grid-template-columns:1fr;gap:16px}
  @media (min-width:760px){.elenco{grid-template-columns:1fr 1fr}}
  .aw{background:var(--card);border-radius:18px;overflow:hidden;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.07),0 8px 22px rgba(0,40,90,.07);border:0;text-align:left;display:block;width:100%;
      opacity:0;transform:translateY(22px) scale(.98);transition:opacity .55s var(--molla),transform .55s var(--molla),box-shadow .25s}
  .aw.vis{opacity:1;transform:none}
  @media (hover:hover){.aw:active{transform:scale(.975);transition-duration:.12s}}   /* sul telefono niente "pressione": scorrendo faceva saltellare i riquadri */
  @media (hover:hover){.aw:hover{box-shadow:0 2px 6px rgba(0,0,0,.08),0 16px 34px rgba(0,98,189,.16)}}
  .aw-img{display:block;width:100%;height:auto;background:#e4ebf3}
  .aw-info{padding:12px 14px 14px;display:flex;align-items:center;gap:12px}
  .aw-marca{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--c)}
  .aw-tit{font-weight:750;font-size:16.5px;line-height:1.2;margin-top:2px;letter-spacing:-.01em}
  .aw-sub{font-size:12.5px;color:var(--testo-soft);margin-top:4px}
  .aw-n{margin-left:auto;flex-shrink:0;background:var(--c);color:#fff;font-weight:700;font-size:12.5px;padding:7px 11px;border-radius:999px;white-space:nowrap;display:flex;align-items:center;gap:4px}
  .aw-n svg{width:14px;height:14px}

  /* Scheda dell'artwork (si apre "uscendo" dal riquadro toccato) */
  .pan{position:fixed;inset:0;z-index:20;background:var(--sfondo);display:none;flex-direction:column;will-change:clip-path}
  .pan.aperto{display:flex}
  .pan-top{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 10px 10px 16px;background:var(--c);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.14)}
  .pan-tit{min-width:0;flex:1}
  .pan-tit b{display:block;font-size:16.5px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pan-tit span{display:block;font-size:12px;opacity:.85;margin-top:1px}
  .btn{background:rgba(255,255,255,.2);border:0;border-radius:999px;height:40px;min-width:40px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-weight:600;flex-shrink:0;transition:transform .15s}
  .btn:active{transform:scale(.9)}
  .btn svg{width:20px;height:20px}
  .pan-corpo{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:none}
  .pan-in{max-width:1100px;margin:0 auto;padding:14px 14px calc(48px + env(safe-area-inset-bottom))}
  .pan-in > *{animation:entra .5s var(--molla) both}
  .pan-img{display:block;width:100%;height:auto;border-radius:16px;box-shadow:0 8px 24px rgba(0,40,90,.14);background:#e4ebf3;cursor:zoom-in}
  .mecc{margin-top:14px;background:var(--card);border-radius:16px;padding:14px 16px 15px;border-left:5px solid var(--c);box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .mecc .val{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--c)}
  .mecc .val svg{width:15px;height:15px}
  .mecc p{font-size:14.5px;line-height:1.5;margin-top:7px}
  .sez{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-scuro);margin:26px 2px 12px}
  .sez .num{font-weight:700;letter-spacing:0;background:#dfe9f5;color:var(--brand-scuro);border-radius:999px;padding:2px 8px;font-size:12px}
  .cerca{position:relative;margin:0 0 10px}
  .cerca svg{position:absolute;left:13px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--testo-soft);pointer-events:none}
  .cerca input{width:100%;height:44px;border-radius:14px;border:1.5px solid var(--linea);padding:0 14px 0 40px;font:inherit;font-size:15.5px;background:#fff;color:var(--testo);transition:border-color .2s,box-shadow .2s}
  .cerca input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px rgba(0,133,255,.12)}
  .filtri{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 12px;margin:0 -14px;padding-left:14px;padding-right:14px;scrollbar-width:none}
  .filtri::-webkit-scrollbar{display:none}
  .filtri button{flex:0 0 auto;border:1.5px solid var(--linea);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:650;cursor:pointer;transition:background .2s,color .2s,border-color .2s,transform .15s}
  @media (hover:hover){.filtri button:active{transform:scale(.94)}}
  .filtri button.si{background:var(--c);border-color:transparent;color:#fff}

  /* Riquadri degli articoli */
  .prodotti{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
  @media (max-width:520px){.prodotti{grid-template-columns:1fr 1fr}}
  .pr{background:var(--card);border:0;border-radius:16px;overflow:hidden;cursor:pointer;text-align:left;display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(0,40,90,.05);
      content-visibility:auto;contain-intrinsic-size:auto 290px;
      opacity:0;transform:translateY(18px);transition:opacity .45s var(--molla),transform .45s var(--molla)}
  .pr.vis{opacity:1;transform:none}
  @media (hover:hover){.pr:active{transform:scale(.96);transition-duration:.12s}}
  .pr-foto{aspect-ratio:1;background:#fff;position:relative}
  .pr-foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .35s}
  .pr-foto img.ok{opacity:1}
  .pr-info{padding:9px 11px 12px;display:flex;flex-direction:column;gap:3px;flex:1;border-top:1px solid #f0f4f8}
  .pr-marca{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
  .pr-nome{font-size:13.5px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .vuoto{grid-column:1/-1;color:var(--testo-soft);font-size:14px;padding:24px 4px;text-align:center}

  /* Dettaglio di un articolo */
  .velo{position:fixed;inset:0;z-index:30;background:rgba(10,30,60,.5);display:none;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .28s ease}
  .velo.aperto{display:flex}
  .velo.vis{opacity:1}
  .det{background:#fff;width:100%;max-width:560px;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;border-radius:24px 24px 0 0;position:relative;
       transform:translateY(100%);transition:transform .42s var(--molla);box-shadow:0 -10px 40px rgba(0,30,70,.2)}
  .velo.vis .det{transform:none}
  @media (min-width:600px){.velo{align-items:center}.det{border-radius:24px;max-height:88vh;transform:translateY(40px) scale(.96);opacity:0;transition:transform .4s var(--molla),opacity .3s}.velo.vis .det{opacity:1}}
  .det-scorre{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:none;padding:16px 18px calc(24px + env(safe-area-inset-bottom));flex:1 1 auto;min-height:0}
  
  .det .chiudi{position:absolute;z-index:2;top:12px;right:12px;background:#eef3f9;color:var(--testo)}
  .det-foto{width:min(68vw,330px);max-width:100%;aspect-ratio:1;max-height:44vh;margin:6px auto 12px;position:relative}
  .det-foto img{width:100%;height:100%;object-fit:contain;display:block}
  .det-in > *{opacity:0;transform:translateY(12px);transition:opacity .4s var(--molla),transform .4s var(--molla)}
  .velo.vis .det-in > *{opacity:1;transform:none}
  .velo.vis .det-in > :nth-child(2){transition-delay:.05s}
  .velo.vis .det-in > :nth-child(3){transition-delay:.1s}
  .velo.vis .det-in > :nth-child(4){transition-delay:.15s}
  .velo.vis .det-in > :nth-child(5){transition-delay:.2s}
  .det-marca{font-size:17px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;color:var(--c)}
  .det h2{font-size:20px;line-height:1.25;margin-top:3px;letter-spacing:-.01em}
  .det table{width:100%;border-collapse:collapse;margin-top:14px;font-size:14.5px}
  .det td{padding:11px 2px;border-bottom:1px solid #eef2f7}
  .det tr:last-child td{border-bottom:0}
  .det td:first-child{color:var(--testo-soft)}
  .det td:last-child{text-align:right;font-weight:650;font-variant-numeric:tabular-nums}

  /* Lente sull'artwork */
  .zoom{position:fixed;inset:0;z-index:40;background:#0d1b2e;display:none;overflow:auto;touch-action:pan-x pan-y pinch-zoom;opacity:0;transition:opacity .25s}
  .zoom.aperto{display:block}
  .zoom.vis{opacity:1}
  .zoom img{display:block;height:100vh;height:100dvh;width:auto;max-width:none}
  @media (orientation:landscape){.zoom img{height:auto;width:100vw}}
  .zoom .btn{position:fixed;top:calc(10px + env(safe-area-inset-top));right:10px;background:#fff;color:var(--testo)}
  .errore{text-align:center;color:var(--testo-soft);padding:60px 20px}
  /* segnaposto con riflesso mentre arrivano le artwork */
  .sk{border-radius:18px;aspect-ratio:2/1;background:linear-gradient(100deg,#e4ebf3 30%,#f1f5fa 50%,#e4ebf3 70%) 0 0/300% 100%;animation:sk 1.3s linear infinite}
  @keyframes sk{from{background-position:100% 0}to{background-position:0 0}}
  /* tocco vero (non scorrimento): il riquadro si abbassa appena e torna su */
  .aw{transition:opacity .55s var(--molla),transform .55s var(--molla),scale .16s ease,box-shadow .25s}
  .pr{transition:opacity .45s var(--molla),transform .45s var(--molla),scale .16s ease}
  .filtri button{transition:background .2s,color .2s,border-color .2s,scale .16s ease}
  .tocco{scale:.965}
  .aw.tocco{scale:.982}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    .aw,.pr,.det-in > *{opacity:1!important;transform:none!important}
  }
</style>

<body>
<header>
  <div class="head-in">
    <div class="logo-box"><div class="logo" role="img" aria-label="F.lli Petrillo &amp; C. srl"></div><span class="luccichio" aria-hidden="true" onanimationend="this.remove()"></span><span class="tricolore" aria-hidden="true"></span></div>
    <h1>Artwork di Novembre <span class="prova">Prova</span></h1>
  </div>
</header>

<main>
  <p class="nota" id="nota">Tocca un'artwork per vedere gli articoli che trattiamo.</p>
  <div class="elenco" id="elenco"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
</main>

<div class="pan" id="pan" role="dialog" aria-modal="true">
  <div class="pan-top">
    <div class="pan-tit"><b id="panTit"></b><span id="panSub"></span></div>
    <button class="btn" id="panChiudi" aria-label="Chiudi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="pan-corpo" id="panCorpo"><div class="pan-in" id="panIn"></div></div>
</div>

<div class="velo" id="velo"><div class="det" id="det" role="dialog" aria-modal="true">
  <button class="btn chiudi" id="detChiudi" aria-label="Chiudi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div class="det-scorre" id="detScorre"></div>
</div></div>
<div class="zoom" id="zoom"><img alt=""><button class="btn" aria-label="Chiudi ingrandimento"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const calmo = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const MOLLA = 'cubic-bezier(.22,.9,.24,1)';
  const ICONA_CAL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
  const ICONA_FRECCIA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
  const ICONA_CERCA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>';

  // ---------- testi: dal codice del listino a un nome leggibile
  const MARCHE = [['PALETTE SYOSS','Syoss'],['BIO PRESTO','Bio Presto'],['LINES SPEC.','Lines Specialist'],['ACE','Ace'],['GOT2B','got2b'],
    ['COLORERIA','Coloreria Italiana'],['TAMPAX','Tampax'],['PAMPERS','Pampers'],['LINES','Lines']];
  function marca(d){
    for(const [k, v] of MARCHE) if(d.startsWith(k+' ')) return [v, d.slice(k.length+1)];
    const m = d.match(/^(\S+)\s+(.*)$/); if(!m) return ['', d];
    return [m[1].charAt(0) + m[1].slice(1).toLowerCase(), m[2]];
  }
  const UNITA = {ML:'ml', L:'L', G:'g', GR:'g', KG:'kg', PZ:'pz', M:'m', MIS:'misurini'};
  const ABBR = {'PAV.':'Pavimenti','LAV.':'Lavatrice','CAND.':'Candeggina','IGIENIZZ.':'Igienizzante','DISINFETT.':'Disinfettante','CONC.':'Concentrato',
    'AMM.':'Ammorbidente','SGRASS.':'Sgrassatore','PROF.':'Profumo','CLASS.':'Classico','DENT.':'Dentifricio','SALV.':'Salviette',
    'PANN.':'Pannolini','MUT.':'Mutandino','SH.':'Shampoo','BALS.':'Balsamo','MASCH.':'Maschera','COL.':'Colorazione','RIPIEG.':'Ripiegati',
    'DIST.':'Distesi','INTERV.':'Intervallo','TAVOL.':'Tavolette','BRILL.':'Brillantante','M/USO':'Multiuso','STYL.':'Styling','PR/SLIP':'Proteggislip','ANATOM.':'Anatomico'};
  function nome(resto){
    return resto.replace(/\.(?=[A-Z]{2})/g, '. ').split(/\s+/).map((w, i) => {
      if(ABBR[w]) return ABBR[w];
      let m = w.match(/^(\d+(?:[,.]\d+)?)(ML|L|G|GR|KG|PZ|M|MIS)\.?$/i);
      if(m && /L\.$/i.test(w) && m[2].toUpperCase()==='L' && i > 0) return m[1]+' lavaggi';
      if(m) return m[1] + (UNITA[m[2].toUpperCase()] === 'L' ? 'L' : ' ' + UNITA[m[2].toUpperCase()]);
      if(/\d/.test(w) || /^[&+\/-]$/.test(w) || /^\(.*\)$/.test(w)) return w;
      if(/^(PZ|ML|KG|GR)$/.test(w)) return w.toLowerCase();
      if(/^(XL|XXL|JR|OS|PMC|WC|S|M|L)$/.test(w)) return w;
      const b = w.toLowerCase();
      return b.charAt(0).toUpperCase() + b.slice(1);
    }).join(' ').replace(/\s+/g, ' ');
  }
  function arricchisci(p){ const [m, r] = marca(p.descrizione); p.marca = m; p.nome = nome(r); return p; }

  // ---------- comparsa morbida mentre si scorre
  const vedi = new IntersectionObserver(voci => voci.forEach(v => {
    if(!v.isIntersecting) return;
    const el = v.target; vedi.unobserve(el);
    el.style.transitionDelay = (el.dataset.r || 0) + 'ms';
    el.classList.add('vis');
    setTimeout(() => el.style.transitionDelay = '', 700);
  }), {rootMargin:'0px 0px -6% 0px'});
  function osserva(contenitore, sel){
    let riga = 0, ultimoTop = null;
    contenitore.querySelectorAll(sel).forEach(el => {
      if(calmo){ el.classList.add('vis'); return; }
      // ritardo a scalare solo dentro la stessa fila
      const t = el.offsetTop; if(t !== ultimoTop){ riga = 0; ultimoTop = t; }
      el.dataset.r = Math.min(riga++ * 60, 240);
      vedi.observe(el);
    });
  }

  let dati = null, aperta = null, cardAperta = null;

  // Riscontro del tocco solo se il dito resta fermo: scorrendo i riquadri non si muovono
  (function(){
    let el = null, t = null, x0 = 0, y0 = 0;
    const via = () => { clearTimeout(t); if(el){ const e = el; setTimeout(() => e.classList.remove('tocco'), 110); } el = null; };
    document.addEventListener('pointerdown', e => {
      const b = e.target.closest('.aw,.pr,.filtri button'); if(!b || calmo) return;
      el = b; x0 = e.clientX; y0 = e.clientY;
      t = setTimeout(() => el && el.classList.add('tocco'), 70);
    }, {passive:true});
    document.addEventListener('pointermove', e => { if(el && Math.hypot(e.clientX - x0, e.clientY - y0) > 8){ clearTimeout(t); el.classList.remove('tocco'); el = null; } }, {passive:true});
    ['pointerup','pointercancel'].forEach(n => document.addEventListener(n, via, {passive:true}));
    document.addEventListener('scroll', () => { if(el){ clearTimeout(t); el.classList.remove('tocco'); el = null; } }, {passive:true, capture:true});
  })();

  window.datiArtwork.then(d => {
    dati = d;
    d.artwork.forEach(a => { a.in_artwork.forEach(arricchisci); a.partecipano.forEach(arricchisci); });
    // le anteprime si scaricano e si preparano PRIMA di mostrarle: scorrendo non resta niente da caricare
    const pronte = d.artwork.map(a => { const im = new Image(); im.src = a.anteprima; return (im.decode ? im.decode() : Promise.resolve()).catch(() => {}); });
    return Promise.race([Promise.all(pronte), new Promise(ok => setTimeout(ok, 1500))]).then(() => mostraElenco(d));
  }).catch(() => { $('elenco').innerHTML = '<div class="errore">Impossibile caricare le artwork. Controlla la connessione e riprova.</div>'; });

  function mostraElenco(d){
    $('elenco').innerHTML = d.artwork.map((a, i) => {
      const [m, t] = a.titolo.split(' · ');
      return '<button class="aw" style="--c:'+a.colore+'" data-i="'+i+'">'+
        '<img class="aw-img" src="'+a.anteprima+'" width="'+a.misure[0]+'" height="'+a.misure[1]+'" alt="'+esc(a.titolo)+'" decoding="sync">'+
        '<div class="aw-info"><div><div class="aw-marca">'+esc(m)+'</div><div class="aw-tit">'+esc(t || m)+'</div><div class="aw-sub">'+esc(a.validita)+'</div></div>'+
        '<span class="aw-n">'+(a.in_artwork.length + a.partecipano.length)+' articoli'+ICONA_FRECCIA+'</span></div></button>';
    }).join('');
    $('elenco').querySelectorAll('.aw').forEach(b => {
      b.onclick = () => apri(+b.dataset.i, b);
      // la foto grande parte appena il dito tocca
      b.addEventListener('pointerdown', () => { const im = new Image(); im.src = d.artwork[+b.dataset.i].immagine; }, {passive:true, once:true});
    });
    // le artwork sono poche: compaiono subito una dopo l'altra, poi restano ferme durante lo scorrimento
    $('elenco').querySelectorAll('.aw').forEach((el, k) => setTimeout(() => el.classList.add('vis'), calmo ? 0 : 60 + k * 90));
    if(location.hash){ const i = d.artwork.findIndex(a => '#'+a.id === location.hash); if(i >= 0) apri(i, null, true); }
  }

  function card(p, k){
    return '<button class="pr" data-k="'+k+'">'+
      '<div class="pr-foto">'+(p.foto ? '<img src="'+p.foto+'" alt="" loading="lazy" decoding="async" onload="this.classList.add(\'ok\')">' : '')+'</div>'+
      '<div class="pr-info"><div class="pr-marca">'+esc(p.marca)+'</div><div class="pr-nome">'+esc(p.nome)+'</div>'+'</div></button>';
  }

  // ---------- apertura dell'artwork: si espande dal riquadro toccato
  function rettangolo(el){
    const r = el.getBoundingClientRect(), W = innerWidth, H = innerHeight;
    return 'inset('+Math.max(0,r.top)+'px '+Math.max(0,W-r.right)+'px '+Math.max(0,H-r.bottom)+'px '+Math.max(0,r.left)+'px round 18px)';
  }
  let altri = [], filtroMarca = '', testo = '';
  function apri(i, daCard, daLink){
    const a = dati.artwork[i]; aperta = a; cardAperta = daCard;
    const pan = $('pan');
    pan.style.setProperty('--c', a.colore); $('velo').style.setProperty('--c', a.colore);
    const [m, t] = a.titolo.split(' · ');
    $('panTit').textContent = a.titolo; $('panSub').textContent = a.validita;
    const marche = [...new Set(a.partecipano.map(p => p.marca))].filter(Boolean).sort((x, y) => x.localeCompare(y));
    $('panIn').innerHTML =
      '<img class="pan-img" id="panImg" src="'+a.immagine+'" width="'+a.misure[0]+'" height="'+a.misure[1]+'" alt="'+esc(a.titolo)+'" decoding="async" style="background:url(\''+a.anteprima+'\') center/cover">'+
      '<div class="mecc" style="animation-delay:.08s"><div class="val">'+ICONA_CAL+esc(a.validita)+'</div>'+a.meccanica.map(x => '<p>'+esc(x)+'</p>').join('')+'</div>'+
      '<div class="sez" style="animation-delay:.14s">Nell\'artwork <span class="num">'+a.in_artwork.length+'</span></div>'+
      '<div class="prodotti" id="vetrina" style="animation:none">'+a.in_artwork.map((p, k) => card(p, 'v'+k)).join('')+'</div>'+
      (a.partecipano.length ?
        (marche.length > 1 ? '<div class="filtri" id="filtri" style="animation:none;margin-top:18px"><button class="si" data-m="">Tutte</button>'+marche.map(x => '<button data-m="'+esc(x)+'">'+esc(x)+'</button>').join('')+'</div>' : '')+
        '<div class="prodotti" id="altri" style="animation:none;margin-top:'+(marche.length > 1 ? 0 : 10)+'px"></div>' : '');
    filtroMarca = ''; testo = '';
    $('panImg').onclick = () => ingrandisci(a);
    $('vetrina').onclick = e => { const b = e.target.closest('.pr'); if(b) dettaglio(a.in_artwork[+b.dataset.k.slice(1)], b); };
    if($('altri')) $('altri').onclick = e => { const b = e.target.closest('.pr'); if(b) dettaglio(altri[+b.dataset.k.slice(1)], b); };
    if($('filtri')) $('filtri').onclick = e => {
      const b = e.target.closest('button'); if(!b) return;
      filtroMarca = b.dataset.m; $('filtri').querySelectorAll('button').forEach(x => x.classList.toggle('si', x === b));
      b.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
      disegnaAltri();
    };
    pan.classList.add('aperto'); document.body.classList.add('fermo');
    $('panCorpo').scrollTop = 0;                 // ogni artwork riparte dall'alto (va fatto dopo averla mostrata)
    disegnaAltri();
    osserva($('vetrina'), '.pr');
    if(!calmo){
      if(daCard) pan.animate([{clipPath: rettangolo(daCard)}, {clipPath:'inset(0px 0px 0px 0px round 0px)'}], {duration:460, easing:MOLLA});
      else pan.animate([{opacity:0, transform:'translateY(24px)'}, {opacity:1, transform:'none'}], {duration:350, easing:MOLLA});
    }
    if(!daLink) history.pushState({p:1}, '', '#'+a.id); else history.replaceState({p:1}, '', '#'+a.id);
  }
  function disegnaAltri(){
    const box = $('altri'); if(!box) return;
    const parole = testo.split(/\s+/).filter(Boolean);
    altri = aperta.partecipano.filter(p => (!filtroMarca || p.marca === filtroMarca) &&
      parole.every(w => p.descrizione.includes(w) || p.nome.toUpperCase().includes(w) || p.ean.includes(w) || p.codice.includes(w)));
    box.innerHTML = altri.length ? altri.map((p, k) => card(p, 'a'+k)).join('') : '<div class="vuoto">Nessun articolo trovato.</div>';
    osserva(box, '.pr');
  }
  function chiudiPan(){
    const pan = $('pan');
    let finita = false;
    const fine = () => { if(finita) return; finita = true; pan.getAnimations().forEach(x => x.cancel()); pan.classList.remove('aperto'); document.body.classList.remove('fermo'); $('panCorpo').scrollTop = 0; $('panIn').innerHTML = ''; };
    const c = cardAperta, a = aperta; aperta = null; cardAperta = null;
    if(calmo) return fine();
    const dest = c && c.querySelector('.aw-img'), r = dest && dest.getBoundingClientRect();
    const visibile = r && r.bottom > 0 && r.top < innerHeight;
    if(!visibile){
      pan.animate([{opacity:1}, {opacity:0, transform:'translateY(20px)'}], {duration:240, easing:'ease-in', fill:'forwards'}).onfinish = fine;
      setTimeout(fine, 500);                     // riserva: se l'animazione non arriva in fondo, la scheda si chiude lo stesso
      return;
    }
    // l'immagine dell'artwork "vola" indietro fino al suo riquadro, mentre la scheda svanisce:
    // arriva esattamente sopra la foto della home, quindi non c'è nessuno scatto finale
    const im = $('panImg'), ri = im.getBoundingClientRect(), top = $('panCorpo').getBoundingClientRect().top;
    const da = (ri.bottom > top + 20) ? ri : {left: r.left, top: top + 14, width: r.width, height: r.height};
    const g = document.createElement('img');
    g.src = a.anteprima; g.alt = '';
    g.style.cssText = 'position:fixed;z-index:25;left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;height:'+r.height+'px;transform-origin:0 0;pointer-events:none;border-radius:18px 18px 0 0;will-change:transform;box-shadow:0 10px 30px rgba(0,40,90,.18)';
    document.body.appendChild(g);
    const sx = da.width / r.width, sy = da.height / r.height;
    g.animate([{transform:'translate('+(da.left-r.left)+'px,'+(da.top-r.top)+'px) scale('+sx+','+sy+')', borderRadius:'16px'},
               {transform:'none', borderRadius:'18px 18px 0 0'}], {duration:420, easing:MOLLA});
    pan.animate([{opacity:1}, {opacity:0}], {duration:260, easing:'ease-out', fill:'forwards'}).onfinish = fine;
    setTimeout(fine, 600);
    setTimeout(() => { g.animate([{opacity:1}, {opacity:0}], {duration:120}).onfinish = () => g.remove(); setTimeout(() => g.remove(), 400); }, 420);
  }

  // ---------- dettaglio dell'articolo: la foto "vola" dal riquadro alla scheda
  function dettaglio(p, daCard){
    $('detScorre').innerHTML =
      '<div class="det-in">'+
      (p.foto ? '<div class="det-foto"><img id="detImg" src="'+p.foto+'" alt=""></div>' : '<div></div>')+
      '<div><div class="det-marca">'+esc(p.marca)+'</div><h2>'+esc(p.nome)+'</h2></div>'+
      '<table>'+
        '<tr><td>Codice articolo</td><td>'+esc(p.codice)+'</td></tr>'+
        '<tr><td>Codice EAN</td><td>'+esc(p.ean || '–')+'</td></tr>'+
        '<tr><td>Pezzi per cartone</td><td>'+(p.pz_cartone || '–')+'</td></tr>'+
        '<tr><td>Descrizione a listino</td><td style="font-size:12.5px">'+esc(p.descrizione)+'</td></tr>'+
      '</table></div>';
    $('detScorre').scrollTop = 0;
    const velo = $('velo');
    velo.classList.add('aperto');
    velo.offsetHeight;                       // fa partire la transizione
    velo.classList.add('vis');
    // la foto parte dal riquadro toccato e arriva al suo posto
    const da = daCard && daCard.querySelector('.pr-foto'), im = $('detImg');
    if(!calmo && da && im){
      const a = da.getBoundingClientRect();
      requestAnimationFrame(() => {
        const b = im.getBoundingClientRect();
        if(!b.width) return;
        const s = a.width / b.width;
        im.animate([{transform:'translate('+(a.left-b.left)+'px,'+(a.top-b.top)+'px) scale('+s+')', transformOrigin:'0 0'},
                    {transform:'none', transformOrigin:'0 0'}], {duration:480, easing:MOLLA});
      });
    }
    history.pushState({d:1}, '');
  }
  function chiudiDet(){
    const velo = $('velo'); velo.classList.remove('vis');
    setTimeout(() => { if(!velo.classList.contains('vis')) velo.classList.remove('aperto'); }, calmo ? 0 : 380);
  }
  $('velo').onclick = e => { if(e.target === $('velo')) history.back(); };
  $('detChiudi').onclick = () => history.back();
  // trascinare giù la scheda la chiude
  (function(){
    const det = $('det'), sc = $('detScorre'); let y0 = null, dy = 0;
    det.addEventListener('touchstart', e => { y0 = (sc.scrollTop <= 0) ? e.touches[0].clientY : null; dy = 0; }, {passive:true});
    det.addEventListener('touchmove', e => {
      if(y0 === null) return; dy = e.touches[0].clientY - y0;
      if(dy > 0){ det.style.transition = 'none'; det.style.transform = 'translateY('+dy+'px)'; } else { y0 = null; det.style.transform = ''; }
    }, {passive:true});
    det.addEventListener('touchend', () => {
      if(y0 === null) return; det.style.transition = ''; det.style.transform = '';
      if(dy > 110) history.back(); y0 = null;
    });
  })();

  // ---------- artwork ingrandita
  function ingrandisci(a){
    const z = $('zoom'); z.querySelector('img').src = a.immagine; z.classList.add('aperto');
    z.offsetHeight; z.classList.add('vis'); z.scrollLeft = 0; history.pushState({z:1}, '');
  }
  function chiudiZoom(){ const z = $('zoom'); z.classList.remove('vis'); setTimeout(() => z.classList.remove('aperto'), 250); }
  $('zoom').querySelector('.btn').onclick = () => history.back();

  $('panChiudi').onclick = () => history.back();
  // il tasto "indietro" chiude prima la lente, poi il dettaglio, poi la scheda
  window.addEventListener('popstate', () => {
    if($('zoom').classList.contains('vis')) return chiudiZoom();
    if($('velo').classList.contains('vis')) return chiudiDet();
    if($('pan').classList.contains('aperto')) chiudiPan();
  });
  document.addEventListener('keydown', e => { if(e.key === 'Escape' && (aperta || $('velo').classList.contains('vis') || $('zoom').classList.contains('vis'))) history.back(); });
})();
</script>
