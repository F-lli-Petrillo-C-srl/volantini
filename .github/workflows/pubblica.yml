name: Pubblica volantini

# Si avvia da solo ogni volta che carichi, rinomini o elimini un file nel repository.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # serve la cronologia per sapere quando è stata caricata ogni grafica

      - name: Installa i convertitori di PDF e immagini
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils python3-pil

      - name: Crea l'elenco delle grafiche e le pagine dei PDF
        run: python3 .github/scripts/elenco.py

      - name: Prepara il sito
        run: |
          mkdir -p _sito
          cp index.html volantini.json sw.js manifest.webmanifest _sito/
          cp -r icone lib _sito/
          [ -f logo.png ] && cp logo.png _sito/ || true
          cp -r volantini _sito/
          [ -d pagine ] && cp -r pagine _sito/ || true
          [ -d prova-artwork ] && cp -r prova-artwork _sito/ || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sito
      - id: deploy
        uses: actions/deploy-pages@v4

