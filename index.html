  .logo{display:block;width:100%;aspect-ratio:943/96;background:var(--logo) left center/contain no-repeat;animation:rivela .45s cubic-bezier(.3,.7,.2,1) both}
  .logo-box + div .marchio{display:none} /* con il logo non ripete il nome */
  @keyframes rivela{from{clip-path:inset(0 100% 0 0);opacity:.3;translate:-6px 0}to{clip-path:inset(0 0 0 0);opacity:1;translate:0 0}}
  .luccichio{position:absolute;left:0;right:0;top:0;aspect-ratio:943/96;pointer-events:none;
    -webkit-mask:var(--logo) left center/contain no-repeat;mask:var(--logo) left center/contain no-repeat;
    background:linear-gradient(105deg,transparent 30%,#14C850 40%,#fff 50%,#FF4048 60%,transparent 70%) no-repeat;background-size:300% 100%;
    animation:brilla .9s .3s ease-in-out both,brillaPiano 9s 3s ease-in-out infinite}
  @keyframes brilla{from{background-position:120% 0}to{background-position:-20% 0}}
  @keyframes brillaPiano{0%,82%{background-position:120% 0;opacity:.0}83%{opacity:.75}100%{background-position:-20% 0;opacity:.75}}
  .tricolore{display:block;height:3px;width:0;margin-top:5px;border-radius:2px;background:linear-gradient(90deg,#14C850 0 33.3%,#fff 33.3% 66.6%,#FF4048 66.6%);animation:cresci .5s .45s cubic-bezier(.3,.7,.2,1) forwards}
  @keyframes cresci{to{width:54px}}
  .marchio{font-size:13px;letter-spacing:.12em;text-transform:uppercase;opacity:.85;font-weight:600}
  h1{font-size:22px;font-weight:700;line-height:1.15;animation:entra .5s .08s cubic-bezier(.2,.7,.2,1) both}
  main{max-width:1100px;margin:0 auto;padding:20px 16px calc(40px + env(safe-area-inset-bottom))}
  .griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
  @media (max-width:520px){.griglia{grid-template-columns:1fr 1fr;gap:10px} h1{font-size:19px}}

  /* Animazione d'ingresso: le schede salgono una dopo l'altra */
  @keyframes entra{from{opacity:0;translate:0 18px}to{opacity:1;translate:0 0}}
  .anima{animation:entra .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 70ms)}

  .card{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08),0 6px 18px rgba(0,0,0,.05);cursor:pointer;display:flex;flex-direction:column;transition:transform .15s,box-shadow .2s}
  @media (hover:hover){.card:active{transform:scale(.98)}}   /* sul telefono niente "pressione": scorrendo faceva saltellare le schede */
  @media (hover:hover){.card:hover{box-shadow:0 2px 6px rgba(0,0,0,.1),0 12px 28px rgba(0,98,189,.14)}}
  .thumb{position:relative;aspect-ratio:1300/1839;background:#e4ebf3;overflow:hidden}
  .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
  .thumb .sfoca{filter:blur(14px);transform:scale(1.15)}
  .thumb .vera{opacity:0;transition:opacity .45s ease}
  .thumb .vera.ok{opacity:1}
  .thumb.pdf{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--brand);font-weight:700}
  .thumb.pdf svg{width:56px;height:56px}
  .badge{position:absolute;z-index:1;top:8px;left:8px;background:var(--accento);color:#1E1E1E;font-size:11px;font-weight:700;padding:4px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em}
  .badge.nuovo{background:var(--brand);color:#fff}
  .tag-pdf{position:absolute;z-index:1;right:8px;bottom:8px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px}
  .info{padding:9px 12px 10px}
  .titolo{font-weight:650;font-size:15px;line-height:1.25}

  /* In evidenza: solo per le offerte a scadenza */
  .ev-etichetta,.sez{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-scuro);margin:2px 2px 10px}
  .sez{margin-top:26px}
  .ev-card{display:grid;grid-template-columns:minmax(120px,38%) 1fr;background:var(--card);border-radius:18px;overflow:hidden;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.08),0 14px 34px rgba(0,98,189,.16);border:2px solid var(--accento);transition:transform .15s}
  @media (hover:hover){.ev-card:active{transform:scale(.99)}}
  .ev-card .thumb{aspect-ratio:1300/1839}
  .ev-info{padding:16px;display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0}
  .ev-tit{font-size:20px;font-weight:750;line-height:1.2}
  .conto{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;margin-top:6px;background:var(--accento);color:#1E1E1E;font-weight:750;font-size:14px;padding:7px 12px;border-radius:999px}
  .conto::before{content:"";width:8px;height:8px;border-radius:50%;background:#1E1E1E;animation:pulsa 1.4s ease-in-out infinite}
  @keyframes pulsa{50%{opacity:.25;transform:scale(.7)}}
  .sfoglia{margin-top:10px;align-self:flex-start;background:var(--brand);color:#fff;font-weight:700;font-size:14px;padding:9px 16px;border-radius:999px}
  @media (min-width:700px){.ev-card{grid-template-columns:260px 1fr}.ev-tit{font-size:26px}.ev-info{padding:24px 28px}}

  .vuoto,.errore{text-align:center;color:var(--testo-soft);padding:60px 20px;font-size:16px;line-height:1.5}
  .caricamento{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
  @media (max-width:520px){.caricamento{grid-template-columns:1fr 1fr;gap:10px}}
  .sk{aspect-ratio:1300/1839;border-radius:14px;background:linear-gradient(90deg,#e4ebf3 25%,#eef3f9 50%,#e4ebf3 75%);background-size:200% 100%;animation:sk 1.2s infinite}
  @keyframes sk{to{background-position:-200% 0}}

  /* Visualizzatore a schermo intero (chiaro: niente bande nere) */
  .lb{position:fixed;inset:0;background:linear-gradient(180deg,#e3ebf5 0%,#f3f6fa 100%);z-index:20;display:none;flex-direction:column;color:var(--testo)}
  .lb.aperto{display:flex}
  .lb.entra{animation:lbEntra .3s cubic-bezier(.2,.7,.2,1) both}
  .lb.esce{animation:lbEsce .2s ease-in both}
  @keyframes lbEntra{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:none}}
  @keyframes lbEsce{to{opacity:0;transform:scale(.92)}}
  .lb-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:rgba(255,255,255,.85);box-shadow:0 1px 0 rgba(0,40,90,.08)}
  .lb-tit{font-weight:650;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lb-sub{font-size:12px;color:var(--testo-soft)}
  .btn{background:rgba(0,60,130,.08);color:var(--testo);border:0;border-radius:999px;height:40px;min-width:40px;padding:0 14px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-decoration:none}
  .btn svg{width:20px;height:20px}
  .lb-azioni{display:flex;gap:8px;flex-shrink:0}
  .lb-corpo{flex:1;position:relative;overflow:hidden}
  .lb-corpo iframe{width:100%;height:100%;border:0;background:#fff}
  /* Libro da sfogliare */
  .lb-libro{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .lb-libro .libro{filter:drop-shadow(0 8px 22px rgba(0,40,90,.22))}
  .lb-libro .pagina{background:#fff center/100% 100% no-repeat;overflow:hidden}
  .lb-libro .pagina img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;user-select:none;-webkit-user-select:none;opacity:0;transition:opacity .25s}
  .lb-libro .pagina img.ok{opacity:1}
  /* Pagina singola o immagine */
  .lb-pagine{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:12px 0 16px;touch-action:pan-x pan-y pinch-zoom;overscroll-behavior:contain}
  .lb-pagine img{display:block;width:100%;max-width:900px;height:auto;margin:0 auto 12px;background:#fff;box-shadow:0 6px 20px rgba(0,40,90,.16);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  .lb-pagine.singola{display:flex;align-items:center;justify-content:center;padding:12px}
  .lb-pagine.singola img{width:auto;max-width:100%;max-height:100%;margin:0;object-fit:contain}
  .lb-pagine.zoom{display:block;padding:0}
  .lb-pagine.zoom img{width:250%;max-width:none;max-height:none;margin:0}
  /* Lente: doppio tocco su una pagina del libro */
  .lente{position:absolute;inset:0;z-index:4;overflow:auto;background:#eef3f9;touch-action:pan-x pan-y pinch-zoom;overscroll-behavior:contain;animation:lente .25s ease-out both}
  .lente img{display:block;width:250%;max-width:none;height:auto;background:#fff}
  @keyframes lente{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
  .lente-chiudi{position:absolute;z-index:5;top:10px;right:10px;background:var(--brand);color:#fff;box-shadow:0 4px 14px rgba(0,40,90,.25)}
  .lb-numero{position:absolute;z-index:3;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,40,90,.78);color:#fff;font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:999px;pointer-events:none;transition:opacity .3s}
  .lb-numero:empty{opacity:0}
  .lb-aiuto{position:absolute;z-index:6;left:50%;bottom:18px;transform:translateX(-50%);background:var(--brand);color:#fff;font-size:13.5px;font-weight:600;padding:9px 14px;border-radius:999px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .35s;box-shadow:0 6px 18px rgba(0,98,189,.35)}
  .lb-aiuto.vedi{opacity:1}
  .lb-mini{display:flex;gap:8px;overflow-x:auto;padding:8px 12px 2px;scrollbar-width:none}
  .lb-mini::-webkit-scrollbar{display:none}
  .lb-mini:empty{display:none}
  .lb-mini button{flex:0 0 auto;width:46px;aspect-ratio:3/4;border:2px solid transparent;border-radius:6px;overflow:hidden;padding:0;background:#fff;cursor:pointer;opacity:.6;box-shadow:0 1px 4px rgba(0,40,90,.15);transition:opacity .2s,border-color .2s,transform .2s}
  .lb-mini button img{width:100%;height:100%;object-fit:cover;display:block}
  .lb-mini button.attiva{opacity:1;border-color:var(--brand);transform:translateY(-2px)}
  .nav{position:absolute;top:50%;transform:translateY(-50%);z-index:3;background:#fff;box-shadow:0 3px 12px rgba(0,40,90,.18);font-size:22px}
  .nav.prev{left:10px}.nav.next{right:10px}
  @media (hover:none){.nav{display:none}}
  .lb-conta{color:var(--testo-soft);text-align:center;font-size:12px;padding:8px 0 calc(10px + env(safe-area-inset-bottom))}

  @media (prefers-reduced-motion:reduce){
    *,*::before{animation:none!important;transition:none!important}
  }
</style>

<body>
<header>
  <div class="head-in">
    <div class="logo-box"><div class="logo" role="img" aria-label="F.lli Petrillo &amp; C. srl"></div><span class="luccichio" aria-hidden="true"></span><span class="tricolore" aria-hidden="true"></span></div>
    <div>
      <div class="marchio">F.lli Petrillo &amp; C. srl</div>
      <h1>Volantini e Promozioni</h1>
    </div>
  </div>
</header>

<main>
  <div id="contenuto" class="caricamento">
    <div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div>
  </div>
</main>

<div class="lb" id="lb" role="dialog" aria-modal="true">
  <div class="lb-top">
    <div style="min-width:0">
      <div class="lb-tit" id="lbTit"></div>
      <div class="lb-sub" id="lbSub"></div>
    </div>
    <div class="lb-azioni">
      <a class="btn" id="lbScarica" download aria-label="Scarica">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-5-5m5 5l5-5M5 21h14"/></svg>
      </a>
      <button class="btn" id="lbCondividi" aria-label="Condividi" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
      </button>
      <button class="btn" id="lbChiudi" aria-label="Chiudi">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>
  <div class="lb-corpo" id="lbCorpo">
    <button class="btn nav prev" id="lbPrev" aria-label="Precedente">‹</button>
    <button class="btn nav next" id="lbNext" aria-label="Successivo">›</button>
    <div class="lb-numero" id="lbNumero"></div>
    <div class="lb-aiuto" id="lbAiuto">Tocca due volte per ingrandire</div>
  </div>
  <div class="lb-mini" id="lbMini"></div>
  <div class="lb-conta" id="lbConta"></div>
</div>

<script>
(function(){
  const CARTELLA = 'volantini/';
  const GIORNI_ULTIMI = 3;         // badge "Ultimi giorni" quando mancano N giorni alla scadenza
  // Solo queste sono offerte a scadenza (conto alla rovescia, "In evidenza", "Ultimi giorni").
  // Le Novità Canvass e i cataloghi non lo sono mai.
  const OFFERTA = /promo|offert|scont|volantin/i;
  const IMG = /\.(jpe?g|png|webp|gif|avif)$/i;
  const PDF = /\.pdf$/i;
  const MESI = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];

  const oggi = new Date(); oggi.setHours(0,0,0,0);
  const $ = id => document.getElementById(id);

  function data(s){ // "2026-11-30" -> Date locale
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s); if(!m) return null;
    const d = new Date(+m[1], +m[2]-1, +m[3]); return isNaN(d) ? null : d;
  }
  function fmt(d){ return d.getDate()+' '+MESI[d.getMonth()]+(d.getFullYear()!==oggi.getFullYear()?' '+d.getFullYear():''); }

  // Nome file: [DAL_][AL_]Titolo.ext
  //  2026-11-20_2026-11-30_Promo-Natale.jpg  -> visibile dal 20 al 30 novembre
  //  2026-11-30_Volantino-Novembre.pdf       -> visibile subito, fino al 30 novembre
  //  Catalogo-Bevande.jpg                    -> sempre visibile
  function analizza(voce){
    const nome = voce.file.replace(/^.*\//,'');
    let base = nome.replace(/\.[^.]+$/,'');
    const parti = base.split('_');
    let dal=null, al=null;
    if(parti.length>=3 && data(parti[0]) && data(parti[1])){ dal=data(parti[0]); al=data(parti[1]); parti.splice(0,2); }
    else if(parti.length>=2 && data(parti[0])){ al=data(parti[0]); parti.splice(0,1); }
    const titolo = parti.join(' ').replace(/[-_]+/g,' ').replace(/\s+/g,' ').trim() || 'Promozione';
    const url = CARTELLA + encodeURIComponent(nome);
    const pdf = PDF.test(nome);
    return {
      url, nome, titolo, dal, al, pdf,
      offerta: OFFERTA.test(titolo) && !/novit/i.test(titolo),
      copertina: voce.copertina || (pdf ? null : url),
      sfocata: voce.sfocata || null,
      pagine: voce.pagine && voce.pagine.length ? voce.pagine : (pdf ? [] : [url]),
      miniature: voce.miniature || [],
      misure: voce.misure || [],
      hd: voce.hd || [],
      aggiunto: voce.aggiunto ? new Date(voce.aggiunto*1000) : null,
      caricato: voce.caricato ? new Date(voce.caricato*1000) : null
    };
  }
  function visibile(v){ return (!v.dal || v.dal <= oggi) && (!v.al || v.al >= oggi); }
  function giorniRimasti(v){ return Math.round((v.al - oggi)/864e5); }
  function scadeTra(v){
    const gg = giorniRimasti(v);
    if(gg>=2) return 'Scade tra '+gg+' giorni';
    if(gg===1) return 'Scade domani';
    const fine = new Date(v.al); fine.setHours(23,59,59,999);
    const ms = Math.max(0, fine - Date.now()), h = Math.floor(ms/36e5), m = Math.floor(ms%36e5/6e4);
    return 'Ultimo giorno · ancora '+(h ? h+' h ' : '')+m+' min';
  }
  function badge(v){
    if(v.offerta && v.al){
      const gg = giorniRimasti(v);
      if(gg===0) return ['Ultimo giorno',''];
      if(gg<=GIORNI_ULTIMI) return ['Ultimi giorni',''];
    }
    // "Nuovo" solo nel giorno in cui la grafica è stata caricata per la prima volta
    if(v.caricato && v.caricato.toDateString() === new Date().toDateString()) return ['Nuovo','nuovo'];
    return null;
  }
  const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  let elenco = [];

  // libreria del libro: caricata in parallelo, senza bloccare la comparsa della pagina
  const libPronta = new Promise(ok => {
    if(window.St) return ok();
    const s = $('libFlip'); s.addEventListener('load', ok); s.addEventListener('error', ok);
    setTimeout(ok, 4000);
  });

  window.datiVolantini
    .then(dati => {
      elenco = dati
        .filter(v => IMG.test(v.file) || PDF.test(v.file))
        .map(analizza)
        .filter(visibile)
        // Novità Canvass sempre per prima, poi le altre dalla più recente
        .sort((a,b) => (/novit/i.test(b.titolo) - /novit/i.test(a.titolo)) || (b.aggiunto||0) - (a.aggiunto||0));
      disegna();
    })
    .catch(() => {
      $('contenuto').className='errore';
      $('contenuto').textContent='Impossibile caricare le promozioni. Controlla la connessione e riprova.';
    });

  const ICONA_PDF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5"/></svg>';

  // Apre il riquadro dell'anteprima (va chiuso da chi la usa, dopo l'eventuale badge)
  function anteprima(v, subito){
    if(!v.copertina) return '<div class="thumb pdf">'+ICONA_PDF+'<span>PDF</span>';
    const n = v.pagine.length;
    return '<div class="thumb">'+
      (v.sfocata ? '<img class="sfoca" src="'+v.sfocata+'" alt="" aria-hidden="true">' : '')+
      '<img class="vera" '+(subito ? 'fetchpriority="high"' : 'loading="lazy"')+' decoding="async" src="'+v.copertina+'" alt="'+esc(v.titolo)+'" onload="this.classList.add(\'ok\')">'+
      (v.pdf && n ? '<span class="tag-pdf">PDF · '+n+(n===1?' pagina':' pagine')+'</span>' : '');
  }

  function disegna(){
    const c = $('contenuto');
    if(!elenco.length){
      c.className='vuoto';
      c.innerHTML='Al momento non ci sono promozioni attive.<br>Torna a trovarci presto!';
      return;
    }
    // In evidenza: l'offerta a scadenza più vicina (mai Novità o cataloghi)
    let iEv = -1;
    elenco.forEach((v,i) => { if(v.offerta && v.al && (iEv<0 || v.al < elenco[iEv].al)) iEv = i; });

    let html = '', k = 0;
    if(iEv >= 0){
      const v = elenco[iEv];
      html += '<section class="anima" style="--i:0"><div class="ev-etichetta">In evidenza</div>'+
        '<article class="ev-card" data-i="'+iEv+'">'+anteprima(v, true)+'</div>'+
        '<div class="ev-info"><div class="ev-tit">'+esc(v.titolo)+'</div>'+
        '<div class="conto" data-i="'+iEv+'">'+scadeTra(v)+'</div>'+
        '<span class="sfoglia">'+(v.pdf ? 'Sfoglia' : 'Guarda')+' →</span></div></article></section>';
      if(elenco.length > 1) html += '<div class="sez anima" style="--i:1">Volantini e cataloghi</div>';
      k = 2;
    }
    html += '<div class="griglia">'+elenco.map((v,i) => {
      if(i===iEv) return '';
      const b = badge(v);
      return '<article class="card anima" style="--i:'+k+'" data-i="'+i+'">'+anteprima(v, k++ < 8)+
        (b ? '<span class="badge '+b[1]+'">'+b[0]+'</span>' : '')+
        '</div><div class="info"><div class="titolo">'+esc(v.titolo)+'</div>'+
        '</div></article>';
    }).join('')+'</div>';

    c.className=''; c.innerHTML = html;
    c.querySelectorAll('img.vera').forEach(im => { if(im.complete && im.naturalWidth) im.classList.add('ok'); });
    c.querySelectorAll('article[data-i]').forEach(el => {
      el.addEventListener('click', () => apri(+el.dataset.i, el));
      el.addEventListener('pointerdown', () => precarica(elenco[+el.dataset.i]), {passive:true});
      el.addEventListener('mouseenter', () => precarica(elenco[+el.dataset.i]));
    });
    if(iEv >= 0) setInterval(() => c.querySelectorAll('.conto').forEach(el => el.textContent = scadeTra(elenco[+el.dataset.i])), 30000);
  }

  // Le prime pagine partono appena il dito tocca la scheda: all'apertura sono già pronte
  const giaPrecaricate = new Set();
  function precarica(v){
    if(!v || giaPrecaricate.has(v.url)) return;
    giaPrecaricate.add(v.url);
    v.pagine.slice(0, 2).forEach((src, n) => { const im = new Image(); if(n===0) im.fetchPriority = 'high'; im.src = src; });
  }

  // ===== Visualizzatore =====
  let corrente = 0, osservatore = null, timerAiuto = null, libro = null, pagineLibro = [], libAttesa = false;
  const lb = $('lb'), corpo = $('lbCorpo'), mini = $('lbMini');
  if(navigator.share) $('lbCondividi').style.display='inline-flex';
  function pulisci(){
    if(osservatore){ osservatore.disconnect(); osservatore = null; }
    if(libro){ try { libro.destroy(); } catch(e){} libro = null; }
    pagineLibro = [];
    corpo.querySelectorAll('iframe,.lb-pagine,.lb-libro,.lente,.lente-chiudi').forEach(n => n.remove());
    mini.innerHTML = ''; $('lbNumero').textContent = '';
  }

  function segnaPagina(n, tot){
    $('lbNumero').textContent = 'Pagina '+(n+1)+' di '+tot;
    const bott = mini.children[n];
    mini.querySelectorAll('.attiva').forEach(b => b.classList.remove('attiva'));
    if(bott){
      bott.classList.add('attiva');
      mini.scrollTo({left: bott.offsetLeft - mini.clientWidth/2 + bott.offsetWidth/2, behavior:'smooth'});
    }
  }

  // Riconosce il doppio tocco (e il doppio clic) su un elemento.
  // Se c'è "singolo", un tocco solo (non seguito da un secondo) chiama quello.
  function doppioTocco(el, azione, singolo){
    let ultimo = 0, ux = 0, uy = 0, sx = 0, sy = 0, t0 = 0, ultimoTouch = 0, attesa = null;
    const ATTESA = 260;
    const rimanda = (x, y) => { clearTimeout(attesa); attesa = setTimeout(() => { attesa = null; singolo(x, y); }, ATTESA); };
    el.addEventListener('touchstart', e => { if(e.touches.length===1){ sx = e.touches[0].clientX; sy = e.touches[0].clientY; t0 = Date.now(); } }, {passive:true});
    el.addEventListener('touchend', e => {
      ultimoTouch = Date.now();
      if(e.touches.length || e.changedTouches.length !== 1) return;
      const t = e.changedTouches[0];
      if(Math.hypot(t.clientX - sx, t.clientY - sy) > 12){ ultimo = 0; return; }   // era uno scorrimento
      const ora = Date.now();
      if(ora - ultimo < 320 && Math.hypot(t.clientX - ux, t.clientY - uy) < 40){
        e.preventDefault(); ultimo = 0; clearTimeout(attesa); attesa = null; azione(t.clientX, t.clientY);
      } else {
        ultimo = ora; ux = t.clientX; uy = t.clientY;
        if(singolo && ora - t0 < 380) rimanda(t.clientX, t.clientY);   // tocco rapido, non pressione
      }
    }, {passive:false});
    el.addEventListener('dblclick', e => { clearTimeout(attesa); attesa = null; azione(e.clientX, e.clientY); });
    if(singolo) el.addEventListener('click', e => {
      if(Date.now() - ultimoTouch < 800 || e.detail > 1) return;   // il tocco l'ha già gestito
      rimanda(e.clientX, e.clientY);
    });
  }

  // Pagina singola / immagine: il doppio tocco ingrandisce nel punto toccato
  function ingrandisci(cont, x, y){
    const r = cont.getBoundingClientRect(), px = x - r.left, py = y - r.top;
    const rx = (cont.scrollLeft + px) / cont.scrollWidth, ry = (cont.scrollTop + py) / cont.scrollHeight;
    cont.classList.toggle('zoom');
    cont.scrollLeft = rx * cont.scrollWidth - px;
    cont.scrollTop = ry * cont.scrollHeight - py;
    nascondiAiuto();
  }

  function mostraAiuto(testo, chiave){
    let visto = false;
    try { visto = localStorage.getItem(chiave) === '1'; } catch(e){}
    if(visto) return;
    $('lbAiuto').textContent = testo; $('lbAiuto').dataset.chiave = chiave;
    $('lbAiuto').classList.add('vedi');
    timerAiuto = setTimeout(nascondiAiuto, 4000);
  }
  function nascondiAiuto(){
    clearTimeout(timerAiuto);
    if(!$('lbAiuto').classList.contains('vedi')) return;
    $('lbAiuto').classList.remove('vedi');
    try { localStorage.setItem($('lbAiuto').dataset.chiave, '1'); } catch(e){}
  }

  // ----- Libro da sfogliare (PDF con più pagine)
  function caricaVicine(n){
    const carica = (k, alta) => {
      const d = pagineLibro[k]; if(!d) return null;
      const im = d.querySelector('img');
      if(!im.getAttribute('src')){ if(alta) im.fetchPriority = 'high'; im.src = im.dataset.src; }
      return im;
    };
    // prima la pagina visibile (e quella accanto), poi le successive
    const ora = carica(n, true); carica(n+1, true);
    const resto = () => { carica(n+2); carica(n+3); carica(n-1); };
    if(ora && !ora.complete){ ora.addEventListener('load', resto, {once:true}); setTimeout(resto, 600); } else resto();
  }
  function costruisciLibro(v, inizio){
    if(libro){ try { libro.destroy(); } catch(e){} libro = null; }
    corpo.querySelectorAll('.lb-libro').forEach(n => n.remove());
    const wrap = document.createElement('div'); wrap.className = 'lb-libro';
    corpo.appendChild(wrap);
    const tot = v.pagine.length;
    const [pw, ph] = v.misure[0] || [990, 1400], r = pw / ph;
    const W = wrap.clientWidth - 24, H = wrap.clientHeight - 24;
    const affiancate = W >= 2 * H * r * 0.92;            // schermo largo: due pagine come un libro aperto
    const lw = Math.floor(affiancate ? Math.min(W/2, H*r) : Math.min(W, H*r)), lh = Math.floor(lw / r);
    const el = document.createElement('div'); el.className = 'libro';
    el.style.width = (affiancate ? 2*lw : lw)+'px'; el.style.height = lh+'px';
    pagineLibro = v.pagine.map((src, n) => {
      const d = document.createElement('div'); d.className = 'pagina'; d.dataset.density = 'soft';
      const anteprima = n===0 ? v.copertina : v.miniature[n];          // già in memoria: compare all'istante
      if(anteprima) d.style.backgroundImage = 'url("'+anteprima+'")';
      const im = document.createElement('img'); im.dataset.src = src; im.alt = v.titolo+' – pagina '+(n+1); im.decoding = 'async';
      im.onload = () => im.classList.add('ok');
      d.appendChild(im); el.appendChild(d); return d;
    });
    wrap.appendChild(el);
    libro = new St.PageFlip(el, {
      width: lw, height: lh, size: 'fixed', usePortrait: true, showCover: false,
      drawShadow: true, maxShadowOpacity: 0.45, flippingTime: 650,
      mobileScrollSupport: false, disableFlipByClick: true, showPageCorners: true,
      swipeDistance: 25, startPage: inizio
    });
    libro.loadFromHTML(pagineLibro);
    libro.on('flip', e => { segnaPagina(e.data, tot); caricaVicine(e.data); nascondiAiuto(); });
    caricaVicine(inizio); segnaPagina(inizio, tot);
    // doppio tocco: lente sulla pagina toccata · tocco singolo: metà destra avanti, metà sinistra indietro
    const giaInVolo = libro;
    doppioTocco(wrap, (x, y) => {
      const b = el.getBoundingClientRect(), ora = libro.getCurrentPageIndex();
      let n = ora, left = b.left, w = b.width;
      if(affiancate){ w = b.width/2; if(x > b.left + w){ n = Math.min(ora+1, tot-1); left = b.left + w; } }
      apriLente(v, n, (x-left)/w, (y-b.top)/b.height);
    }, (x, y) => {
      if(libro !== giaInVolo || lenteAperta() || libro.getState() !== 'read') return;   // sta già girando da sola
      const b = el.getBoundingClientRect();
      if(y < b.top || y > b.bottom) return;
      x < b.left + b.width/2 ? libro.flipPrev('bottom') : libro.flipNext('bottom');
    });
  }
  function apriLente(v, n, rx, ry){
    nascondiAiuto();
    const l = document.createElement('div'); l.className = 'lente';
    const im = document.createElement('img'); im.src = v.pagine[n]; im.alt = v.titolo+' – pagina '+(n+1);
    if(v.hd[n] && v.hd[n] !== v.pagine[n]){ const hd = new Image(); hd.onload = () => { if(im.isConnected) im.src = hd.src; }; hd.src = v.hd[n]; }
    if(v.misure[n]){ im.width = v.misure[n][0]; im.height = v.misure[n][1]; }
    l.appendChild(im);
    const x = document.createElement('button'); x.className = 'btn lente-chiudi'; x.setAttribute('aria-label','Chiudi ingrandimento');
    x.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
    x.onclick = chiudiLente;
    corpo.appendChild(l); corpo.appendChild(x);
    const clamp = q => Math.min(1, Math.max(0, q));
    l.scrollLeft = clamp(rx) * l.scrollWidth - l.clientWidth/2;
    l.scrollTop = clamp(ry) * l.scrollHeight - l.clientHeight/2;
    doppioTocco(l, chiudiLente);
  }
  // miniatura toccata: gira fino a quella pagina (se l'animazione non parte, ci salta direttamente)
  let attesaPagina = null;
  function vaiAPagina(n, prove = 0){
    if(!libro) return;
    chiudiLente(); clearTimeout(attesaPagina);
    const da = libro.getCurrentPageIndex();
    if(n === da) return;
    if(libro.getState() !== 'read'){                      // sta ancora girando: appena finisce, si va
      if(prove < 8) attesaPagina = setTimeout(() => vaiAPagina(n, prove + 1), 120);
      return;
    }
    libro.flip(n, 'bottom');
    setTimeout(() => {
      if(!libro || libro.getState() !== 'read' || libro.getCurrentPageIndex() !== da) return;
      libro.turnToPage(n); segnaPagina(n, pagineLibro.length); caricaVicine(n);
    }, 120);
  }
  function chiudiLente(){ corpo.querySelectorAll('.lente,.lente-chiudi').forEach(n => n.remove()); }
  const lenteAperta = () => !!corpo.querySelector('.lente');

  function apri(i, daEl){
    corrente = (i + elenco.length) % elenco.length;
    const v = elenco[corrente];
    pulisci();
    const tot = v.pagine.length;
    // il visualizzatore va mostrato prima di misurare lo spazio per il libro
    if(!lb.classList.contains('aperto')){
      if(daEl){ // si apre "uscendo" dalla scheda toccata
        const r = daEl.getBoundingClientRect();
        lb.style.transformOrigin = (r.left + r.width/2)+'px '+(r.top + r.height/2)+'px';
      }
      lb.classList.add('aperto','entra');
      setTimeout(() => lb.classList.remove('entra'), 320);
      document.body.style.overflow='hidden'; history.pushState({lb:1},'');
    }
    if(tot > 1 && v.miniature.length === tot){
      v.miniature.forEach((src,n) => {
        const b = document.createElement('button');
        b.setAttribute('aria-label', 'Vai alla pagina '+(n+1));
        b.innerHTML = '<img loading="lazy" src="'+src+'" alt="">';
        mini.appendChild(b);
      });
    }
    // miniature subito in memoria: ogni pagina ha un'anteprima pronta mentre arriva quella nitida
    if(v.miniature) v.miniature.forEach(src => { const im = new Image(); im.src = src; });
    if(tot > 1 && !window.St && !libAttesa){   // libreria non ancora arrivata: si aspetta un istante
      libAttesa = true; $('lbNumero').textContent = 'Caricamento…';
      libPronta.then(() => { if(lb.classList.contains('aperto') && corrente === (i + elenco.length) % elenco.length) apri(i); libAttesa = false; });
      return;
    }
    if(tot > 1 && window.St){
      costruisciLibro(v, 0);
      [...mini.children].forEach((b,n) => b.onclick = () => vaiAPagina(n));
      if(matchMedia('(hover:none)').matches) mostraAiuto('Tocca o scorri per sfogliare · 2 tocchi: zoom', 'volantini-aiuto-libro2');
    } else if(tot){
      const cont = document.createElement('div');
      cont.className = 'lb-pagine' + (tot===1 ? ' singola' : '');
      v.pagine.forEach((src,n) => {
        const im = document.createElement('img');
        im.src = src; im.alt = v.titolo+(tot>1 ? ' – pagina '+(n+1) : '');
        im.dataset.n = n; im.decoding = 'async'; im.draggable = false;
        if(v.misure[n]){ im.width = v.misure[n][0]; im.height = v.misure[n][1]; } // spazio giusto prima del caricamento
        if(n>1) im.loading = 'lazy'; else im.fetchPriority = 'high';
        cont.appendChild(im);
      });
      corpo.appendChild(cont);
      doppioTocco(cont, (x,y) => {
        if(tot===1 && v.hd[0] && v.hd[0] !== v.pagine[0]){ const im = cont.querySelector('img'); if(!im.dataset.hd){ im.dataset.hd = 1; const hd = new Image(); hd.onload = () => { if(im.isConnected) im.src = hd.src; }; hd.src = v.hd[0]; } }
        ingrandisci(cont, x, y);
      });
      if(tot > 1){ // riserva: pagine in colonna se la libreria non si carica
        osservatore = new IntersectionObserver(voci => voci.forEach(x => { if(x.isIntersecting) segnaPagina(+x.target.dataset.n, tot); }),
          {root: cont, rootMargin: '-45% 0px -45% 0px'});
        cont.querySelectorAll('img').forEach(im => osservatore.observe(im));
        [...mini.children].forEach((b,n) => b.onclick = () => { const im = cont.children[n]; cont.scrollTo({top: im.offsetTop - 4, behavior:'smooth'}); });
        segnaPagina(0, tot);
      }
      if(matchMedia('(hover:none)').matches) mostraAiuto('Tocca due volte per ingrandire', 'volantini-aiuto-zoom');
    } else {
      const fr = document.createElement('iframe'); fr.src = v.url; corpo.appendChild(fr);
    }
    $('lbTit').textContent = v.titolo;
    $('lbSub').textContent = tot>1 ? tot+' pagine' : '';
    $('lbScarica').href = v.url; $('lbScarica').setAttribute('download', v.nome);
    $('lbConta').textContent = elenco.length>1 ? (corrente+1)+' di '+elenco.length : '';
    $('lbPrev').style.visibility = $('lbNext').style.visibility = (elenco.length>1 || libro) ? 'visible' : 'hidden';
  }
  function chiudi(daStoria){
    if(!lb.classList.contains('aperto') || lb.classList.contains('esce')) return;
    nascondiAiuto();
    lb.classList.add('esce');
    setTimeout(() => { lb.classList.remove('aperto','esce'); pulisci(); }, 190);
    document.body.style.overflow='';
    if(!daStoria) history.back();
  }
  // Frecce: con un libro aperto girano le pagine, altrimenti passano alla grafica successiva
  const indietro = () => { if(lenteAperta()) return; libro ? libro.flipPrev() : apri(corrente-1); };
  const avanti = () => { if(lenteAperta()) return; libro ? libro.flipNext() : apri(corrente+1); };
  $('lbChiudi').onclick = () => chiudi();
  $('lbPrev').onclick = indietro;
  $('lbNext').onclick = avanti;
  $('lbCondividi').onclick = () => {
    const v = elenco[corrente];
    navigator.share({title:v.titolo, text:'F.lli Petrillo & C. srl – '+v.titolo, url:new URL(v.url, location.href).href}).catch(()=>{});
  };
  window.addEventListener('popstate', () => chiudi(true)); // tasto "indietro" del telefono chiude il visualizzatore
  document.addEventListener('keydown', e => {
    if(!lb.classList.contains('aperto')) return;
    if(e.key==='Escape') lenteAperta() ? chiudiLente() : chiudi();
    if(e.key==='ArrowLeft') indietro();
    if(e.key==='ArrowRight') avanti();
  });
  // telefono girato o finestra ridimensionata: rifà il libro alla pagina corrente
  let timerMisura = null;
  window.addEventListener('resize', () => {
    if(!libro) return;
    clearTimeout(timerMisura);
    timerMisura = setTimeout(() => { if(libro) costruisciLibro(elenco[corrente], libro.getCurrentPageIndex()); }, 250);
  });
  // scorrimento laterale con il dito su un'immagine singola: grafica precedente/successiva
  let x0=null, y0=null;
  corpo.addEventListener('touchstart', e => { if(e.touches.length===1){ x0=e.touches[0].clientX; y0=e.touches[0].clientY; } else x0=null; }, {passive:true});
  corpo.addEventListener('touchend', e => {
    const pizzicato = window.visualViewport && visualViewport.scale > 1.05;
    if(x0===null || pizzicato || libro || lenteAperta() || corpo.querySelector('.lb-pagine.zoom')) { x0=null; return; }
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.8 && elenco.length>1) apri(corrente + (dx<0 ? 1 : -1));
    x0=null;
  });

  // Installabile sul telefono e consultabile anche senza rete
  if('serviceWorker' in navigator && location.protocol === 'https:'){
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js', {updateViaCache: 'none'}).catch(()=>{}));
    // quando arriva una versione nuova della pagina, si ricarica da sola una volta
    if(navigator.serviceWorker.controller){
      let ricaricata = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => { if(!ricaricata){ ricaricata = true; location.reload(); } });
    }
  }
})();
</script>
</body>
</html>
